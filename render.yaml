services:
  - type: web
    name: tienda-online-api
    runtime: docker
    plan: free
    healthCheckPath: /api/productos
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Render genera un valor aleatorio seguro para estas dos automáticamente.
      - key: TIENDA_JWT_SECRET
        generateValue: true
      - key: TIENDA_ADMIN_PASSWORD
        generateValue: true
      # Estas hay que rellenarlas a mano en el panel de Render (ver DEPLOY.md):
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: TIENDA_CORS_ALLOWED_ORIGINS
        sync: false
