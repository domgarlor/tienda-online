spring:
  application:
    name: tienda-online
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  # Render (y la mayoría de PaaS) inyectan su propio puerto en la variable PORT.
  port: ${PORT:8080}

tienda:
  jwt:
    # En producción, sobreescribe esto con la variable de entorno TIENDA_JWT_SECRET
    secret: "cambia-esta-clave-en-produccion-usa-al-menos-32-bytes-aleatorios"
    expiracion-minutos: 60
  cors:
    # Admite varios orígenes separados por coma. En producción, sobreescribe con TIENDA_CORS_ALLOWED_ORIGINS
    allowed-origins: http://localhost:5173
  admin:
    # En producción, sobreescribe con TIENDA_ADMIN_PASSWORD (ver DEPLOY.md)
    password: admin123
  stripe:
    # Pagos con Stripe en MODO TEST. Vacío = pagos desactivados (flujo de pedidos clásico).
    # Define TIENDA_STRIPE_SECRET_KEY (sk_test_...) y TIENDA_STRIPE_PUBLISHABLE_KEY (pk_test_...).
    # NUNCA pongas claves reales (sk_live_...) en este repositorio ni en este proyecto.
    secret-key: ${TIENDA_STRIPE_SECRET_KEY:}
    publishable-key: ${TIENDA_STRIPE_PUBLISHABLE_KEY:}
